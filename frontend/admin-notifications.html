<div
    class="toast"
    id="toast">
</div>


<script>

/* ============================================================
   BOOK N MEET - ADMIN NOTIFICATIONS
============================================================ */

/*
   Notification structure:

   {
       id,
       type,
       title,
       message,
       hospital,
       timestamp,
       read
   }


   IMPORTANT:

   Appointment notifications use:

       booking.patientName

   and NOT:

       loggedInUser.name

   Example:

       Dharani logs in
             ↓
       books for Ram
             ↓
       notification:
       "Ram requested an appointment..."
*/


/* ============================================================
   STORAGE KEY
============================================================ */

const NOTIFICATION_KEY =
    "bookNMeetNotifications";


/* ============================================================
   GET CURRENT STAFF
============================================================ */

function getCurrentStaff() {

    const keys = [

        "bookNMeetCurrentUser",

        "currentUser",

        "loggedInUser",

        "currentStaff",

        "bookNMeetCurrentStaff",

        "staffUser"

    ];


    for (const key of keys) {

        try {

            const value =
                localStorage.getItem(key);

            if (!value) continue;

            const data =
                JSON.parse(value);

            if (
                data &&
                typeof data === "object"
            ) {

                return data;

            }

        } catch (error) {}

    }


    return {};

}


/* ============================================================
   CURRENT HOSPITAL
============================================================ */

function getCurrentHospital() {

    // const staff =
    //     getCurrentStaff();


    // return (

    //     staff.hospital ||

    //     staff.hospitalName ||

    //     staff.selectedHospital ||

    //     staff.hospital_name ||

    //     "Trinity Hospital"

    // ).trim();
     const staff = getCurrentStaff();

    return String(
        staff.hospital ||
        staff.hospitalName ||
        staff.selectedHospital ||
        staff.hospital_name ||
        ""
    ).trim();


}


/* ============================================================
   LOAD NOTIFICATIONS
============================================================ */

function getNotifications() {

    try {

        return JSON.parse(
            localStorage.getItem(
                NOTIFICATION_KEY
            )
        ) || [];

    } catch (error) {

        return [];

    }

}


/* ============================================================
   SAVE NOTIFICATIONS
============================================================ */

function saveNotifications(
    notifications
) {

    localStorage.setItem(
        NOTIFICATION_KEY,
        JSON.stringify(
            notifications
        )
    );

}


/* ============================================================
   NORMALIZE HOSPITAL
============================================================ */

function normalizeHospital(value) {

    return String(value || "")
        .trim()
        .toLowerCase()
        .replace(/\s+/g, " ");

}


/* ============================================================
   ESCAPE HTML
============================================================ */

function escapeHTML(value) {

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* ============================================================
   TIME FORMAT
============================================================ */

function timeAgo(timestamp) {

    const date =
        new Date(timestamp);


    if (
        isNaN(
            date.getTime()
        )
    ) {

        return "Recently";

    }


    const now =
        new Date();


    const seconds =
        Math.floor(
            (
                now - date
            ) / 1000
        );


    if (seconds < 60) {

        return "Just now";

    }


    const minutes =
        Math.floor(
            seconds / 60
        );


    if (minutes < 60) {

        return minutes +
            (
                minutes === 1
                    ? " minute ago"
                    : " minutes ago"
            );

    }


    const hours =
        Math.floor(
            minutes / 60
        );


    if (hours < 24) {

        return hours +
            (
                hours === 1
                    ? " hour ago"
                    : " hours ago"
            );

    }


    const days =
        Math.floor(
            hours / 24
        );


    if (days < 7) {

        return days +
            (
                days === 1
                    ? " day ago"
                    : " days ago"
            );

    }


    return date.toLocaleDateString(
        "en-IN",
        {
            day: "2-digit",
            month: "short",
            year: "numeric"
        }
    );

}


/* ============================================================
   ICON
============================================================ */

function getNotificationIcon(
    type
) {

    const icons = {

        appointment:
            "🗓️",

        confirmed:
            "✅",

        cancelled:
            "❌",

        doctor:
            "🧑‍⚕️",

        schedule:
            "📅",

        patient:
            "👤",

        hospital:
            "🏥",

        system:
            "🔔"

    };


    return (
        icons[type] ||
        icons.system
    );

}


/* ============================================================
   RENDER
============================================================ */

function renderNotifications() {

    const hospital =
        getCurrentHospital();


    const all =
        getNotifications();


    /*
       Only notifications belonging to this
       hospital are shown.

       Notifications without a hospital are
       considered general admin notifications.
    */

    const notifications =
        all.filter(
            notification => {

                if (
                    !notification.hospital
                ) {

                    return true;

                }


                return (
                    normalizeHospital(
                        notification.hospital
                    ) ===
                    normalizeHospital(
                        hospital
                    )
                );

            }
        );


    /*
       Latest notification first.
    */

    notifications.sort(
        (a, b) => {

            return (
                new Date(
                    b.timestamp
                ) -
                new Date(
                    a.timestamp
                )
            );

        }
    );


    const list =
        document.getElementById(
            "notificationsList"
        );


    const empty =
        document.getElementById(
            "emptyState"
        );


    list.innerHTML = "";


    if (
        notifications.length === 0
    ) {

        empty.style.display =
            "block";

        updateBadge([]);

        return;

    }


    empty.style.display =
        "none";


    notifications.forEach(
        notification => {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "notification-item" +
                (
                    notification.read
                        ? ""
                        : " unread"
                );


            item.onclick = () => {

                markRead(
                    notification.id
                );

            };


            const iconClass =
                notification.type ||
                "system";


            item.innerHTML = `

                <div
                    class="notification-icon ${escapeHTML(
                        iconClass
                    )}">

                    ${getNotificationIcon(
                        notification.type
                    )}

                </div>


                <div class="notification-content">

                    <div class="notification-title">

                        ${escapeHTML(
                            notification.title
                        )}

                    </div>


                    <div class="notification-description">

                        ${escapeHTML(
                            notification.message
                        )}

                    </div>


                    <div class="notification-time">

                        ${timeAgo(
                            notification.timestamp
                        )}

                    </div>

                </div>


                ${
                    notification.read
                        ? ""
                        : `<div class="unread-dot"></div>`
                }

            `;


            list.appendChild(
                item
            );

        }
    );


    updateBadge(
        notifications
    );

}


/* ============================================================
   BADGE
============================================================ */

function updateBadge(
    notifications
) {

    const unread =
        notifications.filter(
            item =>
                !item.read
        ).length;


    const badge =
        document.getElementById(
            "notificationBadge"
        );


    badge.textContent =
        unread > 99
            ? "99+"
            : unread;


    badge.style.display =
        unread === 0
            ? "none"
            : "flex";

}


/* ============================================================
   MARK ONE READ
============================================================ */

function markRead(id) {

    const notifications =
        getNotifications();


    const notification =
        notifications.find(
            item =>
                String(item.id) ===
                String(id)
        );


    if (notification) {

        notification.read =
            true;

    }


    saveNotifications(
        notifications
    );


    renderNotifications();

}


/* ============================================================
   MARK ALL READ
============================================================ */

function markAllRead() {

    const notifications =
        getNotifications();


    const hospital =
        getCurrentHospital();


    notifications.forEach(
        notification => {

            const belongsToHospital =

                !notification.hospital ||

                normalizeHospital(
                    notification.hospital
                ) ===
                normalizeHospital(
                    hospital
                );


            if (
                belongsToHospital
            ) {

                notification.read =
                    true;

            }

        }
    );


    saveNotifications(
        notifications
    );


    renderNotifications();


    showToast(
        "All notifications marked as read."
    );

}


/* ============================================================
   TOAST
============================================================ */

function showToast(
    message
) {

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    setTimeout(
        () => {

            toast.classList.remove(
                "show"
            );

        },
        2500
    );

}


/* ============================================================
   LOGOUT
============================================================ */

function logout() {

    localStorage.removeItem(
        "bookNMeetCurrentUser"
    );

    localStorage.removeItem(
        "currentUser"
    );

    localStorage.removeItem(
        "loggedInUser"
    );


    window.location.href =
        "landing.html";

}


/* ============================================================
   HEADER
============================================================ */

function loadHeader() {

    const staff =
        getCurrentStaff();


    const name =

        staff.name ||

        staff.fullName ||

        staff.username ||

        staff.staffName ||

        "User";


    const hospital =
        getCurrentHospital();


    document.getElementById(
        "profileName"
    ).textContent =
        name;


    document.getElementById(
        "profileHospital"
    ).textContent =
        hospital;


    document.getElementById(
        "profileInitial"
    ).textContent =
        name
            .charAt(0)
            .toUpperCase();


    document.getElementById(
        "currentHospital"
    ).textContent =
        hospital;

}


/* ============================================================
   REAL-TIME LOCAL UPDATE
============================================================ */

window.addEventListener(
    "storage",
    function(event) {

        if (
            event.key ===
            NOTIFICATION_KEY
        ) {

            renderNotifications();

        }

    }
);


window.addEventListener(
    "focus",
    function() {

        loadHeader();

        renderNotifications();

    }
);


document.addEventListener(
    "visibilitychange",
    function() {

        if (
            !document.hidden
        ) {

            loadHeader();

            renderNotifications();

        }

    }
);


/* ============================================================
   INITIAL LOAD
============================================================ */

loadHeader();

renderNotifications();

</script>

<script src="js/admin-header.js"></script>
<script src="js/site-links.js"></script>

</body>
