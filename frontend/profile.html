     MESSAGE
===================================================== -->

<div
    class="profile-message"
    id="profileMessage">
</div>


<script>

/* =====================================================
   GET CURRENT USER
===================================================== */

let currentUser =
    JSON.parse(
        localStorage.getItem(
            "bookNMeetCurrentUser"
        )
    );


/*
   If nobody is logged in,
   send them to login page.
*/

if(!currentUser){

    window.location.href = "landing.html";

}


/* =====================================================
   DISPLAY USER PROFILE
===================================================== */

function displayProfile(){

    if(!currentUser){
        return;
    }


    const name =
        currentUser.name || "User";


    document.getElementById(
        "heroName"
    ).textContent = name;


    document.getElementById(
        "profileName"
    ).textContent =
        name;


    document.getElementById(
        "profilePhone"
    ).textContent =
        currentUser.contact || "-";


    document.getElementById(
        "profileEmail"
    ).textContent =
        currentUser.email || "-";


    /*
       First letter of name
    */

    document.getElementById(
        "profileAvatar"
    ).textContent =
        name.charAt(0).toUpperCase();

}


displayProfile();


/* =====================================================
   OPEN EDIT PROFILE
===================================================== */

function openEditProfile(){

    document.getElementById(
        "editName"
    ).value =
        currentUser.name || "";


    document.getElementById(
        "editPhone"
    ).value =
        currentUser.contact || "";


    document.getElementById(
        "editEmail"
    ).value =
        currentUser.email || "";


    document.getElementById(
        "editProfileModal"
    ).classList.add("show");

}


/* =====================================================
   CLOSE EDIT PROFILE
===================================================== */

function closeEditProfile(){

    document.getElementById(
        "editProfileModal"
    ).classList.remove("show");

}


/* =====================================================
   SAVE PROFILE
===================================================== */

function saveProfile(){

    const name =
        document.getElementById(
            "editName"
        ).value.trim();


    const phone =
        document.getElementById(
            "editPhone"
        ).value.trim();


    const email =
        document.getElementById(
            "editEmail"
        ).value.trim()
        .toLowerCase();


    /* NAME */

    if(!name){

        showMessage(
            "Please enter your name."
        );

        return;

    }


    if(!/^[A-Za-z ]+$/.test(name)){

        showMessage(
            "Name should contain only letters."
        );

        return;

    }


    /* PHONE */

    if(!/^[0-9]{10}$/.test(phone)){

        showMessage(
            "Enter a valid 10-digit phone number."
        );

        return;

    }


    /* EMAIL */

    if(!/^[A-Za-z0-9._%+-]+@gmail\.com$/i.test(email)){

        showMessage(
            "Please enter a valid Gmail address."
        );

        return;

    }


    /*
       Store old email before changing it.
       This is important because appointments
       are connected to the user's email.
    */

    const oldEmail =
        currentUser.email;


    /* ============================================
       UPDATE CURRENT USER
    ============================================ */

    currentUser.name =
        name;

    currentUser.contact =
        phone;

    currentUser.email =
        email;


    localStorage.setItem(
        "bookNMeetCurrentUser",
        JSON.stringify(currentUser)
    );


    /* ============================================
       UPDATE USERS
    ============================================ */

    let accounts =
        JSON.parse(
            localStorage.getItem(
                "bookNMeetUsers"
            )
        ) || [];


    accounts =
        accounts.map(account => {

            /*
               Find the account using
               the old email.
            */

            if(
                account.email &&
                account.email.toLowerCase() ===
                oldEmail.toLowerCase()
            ){

                account.name =
                    name;

                account.contact =
                    phone;

                account.email =
                    email;

            }

            return account;

        });


    localStorage.setItem(
        "bookNMeetUsers",
        JSON.stringify(accounts)
    );


    /*
       ============================================
       UPDATE EMAIL IN EXISTING APPOINTMENTS
       ============================================

       This is important.

       If the user changes their email,
       their old appointments should still
       appear in Appointment History.
    */

    let bookings =
        JSON.parse(
            localStorage.getItem(
                "bookNMeetBookings"
            )
        ) || [];


    let bookingsChanged = false;


    bookings =
        bookings.map(booking => {

            if(
                booking.email &&
                booking.email.toLowerCase() ===
                oldEmail.toLowerCase()
            ){

                booking.email =
                    email;

                /*
                   Keep the actual patient's name and phone unchanged.
                   Only update the account/owner information.
                */
                if(booking.bookedByEmail){
                    booking.bookedByEmail = email;
                }

                if(booking.accountEmail){
                    booking.accountEmail = email;
                }

                if(booking.userEmail){
                    booking.userEmail = email;
                }

                bookingsChanged = true;

            }

            return booking;

        });


    if(bookingsChanged){

        localStorage.setItem(
            "bookNMeetBookings",
            JSON.stringify(bookings)
        );

    }


    /* Refresh page data */

    displayProfile();

    loadAppointmentHistory();

    closeEditProfile();


    showMessage(
        "Profile updated successfully."
    );

}


/* =====================================================
   APPOINTMENT HISTORY
===================================================== */

function loadAppointmentHistory(){

    const bookings =
        JSON.parse(
            localStorage.getItem(
                "bookNMeetBookings"
            )
        ) || [];


    const container =
        document.getElementById(
            "appointmentHistory"
        );


    /*
       Find only this user's appointments.

       We use email because booking.html
       saves the patient's email.
    */

    const userEmail =
        currentUser.email
            ? currentUser.email
                .trim()
                .toLowerCase()
            : "";


    const userAppointments =
        bookings.filter(booking => {

            /*
               An account can book an appointment for another patient.
               Never use patientName to decide account ownership.

               New bookings store the account that created the booking
               in bookedByEmail/accountEmail. Older bookings fall back
               to booking.email.
            */

            const accountEmail = String(
                booking.bookedByEmail ||
                booking.accountEmail ||
                booking.userEmail ||
                booking.email ||
                ""
            ).trim().toLowerCase();

            return accountEmail === userEmail;

        });


    /*
       Appointment count
    */

    const count =
        userAppointments.length;


    document.getElementById(
        "appointmentCount"
    ).textContent =

        count +
        (
            count === 1
                ? " appointment"
                : " appointments"
        );


    /*
       No appointments
    */

    if(count === 0){

        container.innerHTML = `

            <div class="no-appointments">

                <div class="empty-icon">
                    📅
                </div>

                <h3>
                    No appointments yet
                </h3>

                <p>
                    Your booked appointments
                    will appear here.
                </p>

            </div>

        `;

        return;

    }


    /*
       Clear previous cards
    */

    container.innerHTML = "";


    /*
       Latest booking first
    */

    userAppointments
        .slice()
        .reverse()
        .forEach(booking => {

            createAppointmentCard(
                booking,
                container
            );

        });

}


/* =====================================================
   CREATE APPOINTMENT CARD
===================================================== */

function createAppointmentCard(
    booking,
    container
){

    /*
       If admin has not assigned a status,
       default to Pending.
    */

    const status =
        booking.status || "Pending";


    /*
       Convert status to CSS class.
    */

    const statusClass =
        status
            .toLowerCase()
            .replace(/\s+/g,"");


    const card =
        document.createElement("div");


    card.className =
        "appointment-card";


    card.innerHTML = `

        <div class="appointment-top">

            <div>

                <div class="hospital-name">
                    ${escapeHTML(
                        booking.hospital ||
                        "-"
                    )}
                </div>

                <div class="doctor-name">
                    ${escapeHTML(
                        booking.doctor ||
                        "-"
                    )}
                </div>

            </div>


            <span
                class="
                    status
                    ${statusClass}
                ">

                ${escapeHTML(status)}

            </span>

        </div>


        <div class="appointment-details">


            <div class="appointment-detail">

                <span>
                    Patient Name
                </span>

                <strong>
                    ${escapeHTML(
                        booking.patientName ||
                        "-"
                    )}
                </strong>

            </div>


            <div class="appointment-detail">

                <span>
                    Specialization
                </span>

                <strong>
                    ${escapeHTML(
                        booking.speciality ||
                        "-"
                    )}
                </strong>

            </div>


            <div class="appointment-detail">

                <span>
                    Appointment Date
                </span>

                <strong>
                    ${escapeHTML(
                        booking.date ||
                        "-"
                    )}
                </strong>

            </div>


            <div class="appointment-detail">

                <span>
                    Time Slot
                </span>

                <strong>
                    ${escapeHTML(
                        booking.slot ||
                        "-"
                    )}
                </strong>

            </div>


            <div class="appointment-detail">

                <span>
                    Patient Age
                </span>

                <strong>
                    ${
                        booking.age
                            ? escapeHTML(
                                booking.age
                              ) + " years"
                            : "-"
                    }
                </strong>

            </div>


        </div>

    `;

    /*
       Patients can cancel an appointment that is still
       waiting or confirmed, as long as its date has not passed.
    */
    const today = new Date();
    const todayText =
        today.getFullYear() + "-" +
        String(today.getMonth() + 1).padStart(2, "0") + "-" +
        String(today.getDate()).padStart(2, "0");

    if(
        (status === "Pending" || status === "Upcoming") &&
        String(booking.date || "") >= todayText
    ){
        const cancelButton = document.createElement("button");
        cancelButton.type = "button";
        cancelButton.className = "cancel-appointment-btn";
        cancelButton.textContent = "Cancel appointment";

        cancelButton.addEventListener("click", function(){
            const sure = confirm(
                "Cancel your appointment with " +
                (booking.doctor || "the doctor") + " on " +
                (booking.date || "") + " at " + (booking.slot || "") + "?"
            );
            if(sure){
                updateBookingStatus(booking.id, "Canceled");
            }
        });

        card.appendChild(cancelButton);
    }

    container.appendChild(card);
}

function updateBookingStatus(bookingId, newStatus) {

    let bookings =
        JSON.parse(
            localStorage.getItem("bookNMeetBookings")
        ) || [];

    bookings = bookings.map(booking => {

        if (String(booking.id) === String(bookingId)) {
            booking.status = newStatus;
        }

        return booking;
    });

    try{
        // js/sync.js sends this to the server (and explains if it is refused)
        localStorage.setItem(
            "bookNMeetBookings",
            JSON.stringify(bookings)
        );
    }catch(error){
        // nothing more to do: the saved copy was put back
    }
    loadAppointmentHistory();
}

/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

    const div =
        document.createElement("div");

    div.textContent =
        value;

    return div.innerHTML;

}


/* =====================================================
   SHOW MESSAGE
===================================================== */

function showMessage(text){

    const message =
        document.getElementById(
            "profileMessage"
        );


    message.textContent =
        text;


    message.classList.add(
        "show"
    );


    setTimeout(() => {

        message.classList.remove(
            "show"
        );

    }, 2500);

}


/* =====================================================
   LOGOUT
===================================================== */

function logout(){

    localStorage.removeItem(
        "bookNMeetCurrentUser"
    );

    window.location.href =
        "first.html";

}


/* =====================================================
   CLOSE MODAL WHEN CLICKING OUTSIDE
===================================================== */

document
.getElementById("editProfileModal")
.addEventListener(
    "click",
    function(event){

        if(
            event.target ===
            this
        ){

            closeEditProfile();

        }

    }
);


/* =====================================================
   INITIAL APPOINTMENT LOAD
===================================================== */

loadAppointmentHistory();


/*
   Refresh appointment status periodically.

   This allows the page to reflect changes
   made to the booking data while the profile
   page is open.
*/

setInterval(
    loadAppointmentHistory,
    2000
);

</script>
