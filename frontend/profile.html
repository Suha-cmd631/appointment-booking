<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


/* =====================================================
   BODY
===================================================== */

body{

}


/* =====================================================
   HEADER
===================================================== */

.header{

    height:80px;

    background:white;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 45px;

        0 4px 20px rgba(18,52,91,0.08);

    top:0;

    z-index:100;

}


.logo{

    font-size:28px;

}


.logo span{

}


.header-right{

    gap:15px;

}


.header-title{

    font-family:"Space Grotesk",sans-serif;

    font-weight:600;

/* =====================================================
   LOGOUT
===================================================== */

.logout-btn{

    color:#c62828;

    border-radius:9px;

    font-size:13px;

    font-weight:600;

    cursor:pointer;

    transition:0.2s;

}

===================================================== */

===================================================== */

}


.profile-avatar{

}


.profile-hero h1{

}


.profile-hero p{

}


/* =====================================================
   PROFILE CARD
===================================================== */

.profile-card{

    background:white;

    border-radius:20px;

    padding:28px;

    box-shadow:
        0 7px 25px rgba(18,52,91,0.08);

    margin-bottom:30px;

}


.card-heading{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:25px;

}


.card-heading h2{

    font-family:"Space Grotesk",sans-serif;

    font-size:22px;

}


/* =====================================================
   EDIT BUTTON
===================================================== */

.edit-profile-btn{

    border:none;

    background:#e9f8f7;

    color:#147f7a;

    padding:11px 18px;

    border-radius:9px;

    font-size:13px;

    font-weight:700;

    cursor:pointer;

    transition:0.2s;

}


.edit-profile-btn:hover{

    background:#1d9c96;

    color:white;

}


/* =====================================================
   DETAILS GRID
===================================================== */

.details-grid{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:18px;

}


.detail-box{

    background:#f7fafc;

    border:1px solid #e3ebf1;

    border-radius:13px;

    padding:18px;

}


.detail-box span{

    display:block;

    color:#7b8c9c;

    font-size:12px;

    margin-bottom:7px;

}


.detail-box strong{

    display:block;

    color:#12345b;

    font-size:15px;

    word-break:break-word;

}


/* =====================================================
   APPOINTMENT SECTION
===================================================== */

.history-section{

    margin-top:10px;

}


.history-heading{

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:18px;

}


.history-heading h2{

    font-family:"Space Grotesk",sans-serif;

    font-size:24px;

}


.appointment-count{

    background:#e9f8f7;

    color:#147f7a;

    padding:7px 14px;

    border-radius:20px;

    font-size:12px;

    font-weight:700;

}


/* =====================================================
   APPOINTMENT CARD
===================================================== */

.appointment-card{

    background:white;

    border-radius:18px;

    padding:24px;

    margin-bottom:18px;

    box-shadow:
        0 6px 22px rgba(18,52,91,0.08);

    border-left:5px solid #1d9c96;

}


.appointment-top{

    display:flex;

    justify-content:space-between;

    align-items:flex-start;

    gap:15px;

    margin-bottom:20px;

}


.hospital-name{

    font-family:"Space Grotesk",sans-serif;

    font-size:19px;

    color:#12345b;

    margin-bottom:6px;

}


.doctor-name{

    color:#1d9c96;

    font-size:14px;

    font-weight:600;

}


/* =====================================================
   STATUS
===================================================== */

.appointment-status{

    padding:7px 15px;

    border-radius:20px;

    font-size:11px;

    font-weight:700;

    white-space:nowrap;

}


.appointment-status.pending{

    background:#fff3cd;

    color:#856404;

}


.appointment-status.confirmed{

    background:#dff7f3;

    color:#13756f;

}


.appointment-status.completed{

    background:#e2f5e9;

    color:#237642;

}


.appointment-status.canceled{

    background:#ffe5e5;

    color:#c62828;

}


/* =====================================================
   APPOINTMENT DETAILS
===================================================== */

.appointment-details{

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:15px;

    border-top:1px solid #edf1f4;

    padding-top:18px;

}


.appointment-detail{

    background:#f8fafc;

    padding:12px;

    border-radius:10px;

}


.appointment-detail span{

    display:block;

    color:#7b8c9c;

    font-size:11px;

    margin-bottom:5px;

}


.appointment-detail strong{

    display:block;

    color:#12345b;

    font-size:13px;

}


/* =====================================================
   EMPTY APPOINTMENTS
===================================================== */

.no-appointments{

    background:white;

    border-radius:18px;

    padding:60px 25px;

    text-align:center;

    box-shadow:
        0 6px 22px rgba(18,52,91,0.08);

}


.empty-icon{

    font-size:45px;

    margin-bottom:15px;

}


.no-appointments h3{

    font-family:"Space Grotesk",sans-serif;

    font-size:20px;

    margin-bottom:8px;

}


.no-appointments p{

    color:#718397;

    font-size:14px;

}


/* =====================================================
   MODAL
===================================================== */

.modal{

    position:fixed;

    inset:0;

    background:
        rgba(18,52,91,0.55);

    display:none;

    align-items:center;

    justify-content:center;

    padding:20px;

    z-index:1000;

}


.modal.show{

    display:flex;

}


.modal-content{

    width:100%;

    max-width:520px;

    background:white;

    border-radius:20px;

    padding:30px;

    position:relative;

    box-shadow:

}


.modal-content h2{

    margin-bottom:25px;

    font-size:24px;

}


.close-btn{

    position:absolute;

    right:18px;

    top:15px;

    width:35px;

    height:35px;

    border:none;

    border-radius:50%;

    background:#f1f4f6;

    color:#12345b;

    font-size:22px;

    cursor:pointer;

}


.form-group{

    margin-bottom:17px;

}


.form-group label{

    display:block;

    font-size:13px;

    font-weight:600;

    color:#45627d;

    margin-bottom:7px;

}


.form-group input{

    width:100%;

    height:45px;

    border:1px solid #d5e1ea;

    border-radius:10px;

    padding:0 14px;

    font-size:14px;

    outline:none;

}


.form-group input:focus{

    border-color:#1d9c96;

    box-shadow:
        0 0 0 3px rgba(29,156,150,0.1);

}


/* =====================================================
   SAVE BUTTON
===================================================== */

.save-profile-btn{

    width:100%;

    height:48px;

    border:none;

    border-radius:10px;

    background:
        linear-gradient(
            135deg,
            #1d9c96,
            #157d79
        );

    color:white;

    font-size:15px;

    font-weight:700;

    cursor:pointer;

    margin-top:8px;

}


.save-profile-btn:hover{

    box-shadow:
        0 7px 18px rgba(29,156,150,0.25);

}


/* =====================================================
   MESSAGE
===================================================== */

.profile-message{

    position:fixed;

    right:25px;

    bottom:25px;

    background:#12345b;

    color:white;

    padding:14px 20px;

    border-radius:10px;

    font-size:13px;

    display:none;

    z-index:2000;

    box-shadow:
        0 8px 25px rgba(0,0,0,0.15);

}


.profile-message.show{

    display:block;

}

<script>

/* =====================================================
   GET CURRENT USER
===================================================== */

let currentUser =
    JSON.parse(
        localStorage.getItem(
            "bookNMeetCurrentUser"
        )
    );


/*
   If nobody is logged in,
   send them to login page.
*/

if(!currentUser){

    window.location.href = "landing.html";

}


/* =====================================================
   DISPLAY USER PROFILE
===================================================== */

function displayProfile(){

    if(!currentUser){
        return;
    }


    const name =
        currentUser.name || "User";


    document.getElementById(
        "heroName"
    ).textContent = name;


    document.getElementById(
        "profileName"
    ).textContent =
        name;


    document.getElementById(
        "profilePhone"
    ).textContent =
        currentUser.contact || "-";


    document.getElementById(
        "profileEmail"
    ).textContent =
        currentUser.email || "-";


    /*
       First letter of name
    */

    document.getElementById(
        "profileAvatar"
    ).textContent =
        name.charAt(0).toUpperCase();

}


displayProfile();


/* =====================================================
   OPEN EDIT PROFILE
===================================================== */

function openEditProfile(){

    document.getElementById(
        "editName"
    ).value =
        currentUser.name || "";


    document.getElementById(
        "editPhone"
    ).value =
        currentUser.contact || "";


    document.getElementById(
        "editEmail"
    ).value =
        currentUser.email || "";


    document.getElementById(
        "editProfileModal"
    ).classList.add("show");

}


/* =====================================================
   CLOSE EDIT PROFILE
===================================================== */

function closeEditProfile(){

    document.getElementById(
        "editProfileModal"
    ).classList.remove("show");

}


/* =====================================================
   SAVE PROFILE
===================================================== */

function saveProfile(){

    const name =
        document.getElementById(
            "editName"
        ).value.trim();


    const phone =
        document.getElementById(
            "editPhone"
        ).value.trim();


    const email =
        document.getElementById(
            "editEmail"
        ).value.trim()
        .toLowerCase();


    /* NAME */

    if(!name){

        showMessage(
            "Please enter your name."
        );

        return;

    }


    if(!/^[A-Za-z ]+$/.test(name)){

        showMessage(
            "Name should contain only letters."
        );

        return;

    }


    /* PHONE */

    if(!/^[0-9]{10}$/.test(phone)){

        showMessage(
            "Enter a valid 10-digit phone number."
        );

        return;

    }


    /* EMAIL */

    if(!/^[A-Za-z0-9._%+-]+@gmail\.com$/i.test(email)){

        showMessage(
            "Please enter a valid Gmail address."
        );

        return;

    }


    /*
       Store old email before changing it.
       This is important because appointments
       are connected to the user's email.
    */

    const oldEmail =
        currentUser.email;


    /* ============================================
       UPDATE CURRENT USER
    ============================================ */

    currentUser.name =
        name;

    currentUser.contact =
        phone;

    currentUser.email =
        email;


    localStorage.setItem(
        "bookNMeetCurrentUser",
        JSON.stringify(currentUser)
    );


    /* ============================================
       UPDATE USERS
    ============================================ */

    let accounts =
        JSON.parse(
            localStorage.getItem(
                "bookNMeetUsers"
            )
        ) || [];


    accounts =
        accounts.map(account => {

            /*
               Find the account using
               the old email.
            */

            if(
                account.email &&
                account.email.toLowerCase() ===
                oldEmail.toLowerCase()
            ){

                account.name =
                    name;

                account.contact =
                    phone;

                account.email =
                    email;

            }

            return account;

        });


    localStorage.setItem(
        "bookNMeetUsers",
        JSON.stringify(accounts)
    );


    /*
       ============================================
       UPDATE EMAIL IN EXISTING APPOINTMENTS
       ============================================

       This is important.

       If the user changes their email,
       their old appointments should still
       appear in Appointment History.
    */

    let bookings =
        JSON.parse(
            localStorage.getItem(
                "bookNMeetBookings"
            )
        ) || [];


    let bookingsChanged = false;


    bookings =
        bookings.map(booking => {

            if(
                booking.email &&
                booking.email.toLowerCase() ===
                oldEmail.toLowerCase()
            ){

                booking.email =
                    email;

                /*
                   Keep the actual patient's name and phone unchanged.
                   Only update the account/owner information.
                */
                if(booking.bookedByEmail){
                    booking.bookedByEmail = email;
                }

                if(booking.accountEmail){
                    booking.accountEmail = email;
                }

                if(booking.userEmail){
                    booking.userEmail = email;
                }

                bookingsChanged = true;

            }

            return booking;

        });


    if(bookingsChanged){

        localStorage.setItem(
            "bookNMeetBookings",
            JSON.stringify(bookings)
        );

    }


    /* Refresh page data */

    displayProfile();

    loadAppointmentHistory();

    closeEditProfile();


    showMessage(
        "Profile updated successfully."
    );

}


/* =====================================================
   APPOINTMENT HISTORY
===================================================== */

function loadAppointmentHistory(){

    const bookings =
        JSON.parse(
            localStorage.getItem(
                "bookNMeetBookings"
            )
        ) || [];


    const container =
        document.getElementById(
            "appointmentHistory"
        );


    /*
       Find only this user's appointments.

       We use email because booking.html
       saves the patient's email.
    */

    const userEmail =
        currentUser.email
            ? currentUser.email
                .trim()
                .toLowerCase()
            : "";


    const userAppointments =
        bookings.filter(booking => {

            /*
               An account can book an appointment for another patient.
               Never use patientName to decide account ownership.

               New bookings store the account that created the booking
               in bookedByEmail/accountEmail. Older bookings fall back
               to booking.email.
            */

            const accountEmail = String(
                booking.bookedByEmail ||
                booking.accountEmail ||
                booking.userEmail ||
                booking.email ||
                ""
            ).trim().toLowerCase();

            return accountEmail === userEmail;

        });


    /*
       Appointment count
    */

    const count =
        userAppointments.length;


    document.getElementById(
        "appointmentCount"
    ).textContent =

        count +
        (
            count === 1
                ? " appointment"
                : " appointments"
        );


    /*
       No appointments
    */

    if(count === 0){

        container.innerHTML = `

            <div class="no-appointments">

                <div class="empty-icon">
                    📅
                </div>

                <h3>
                    No appointments yet
                </h3>

                <p>
                    Your booked appointments
                    will appear here.
                </p>

            </div>

        `;

        return;

    }


    /*
       Clear previous cards
    */

    container.innerHTML = "";


    /*
       Latest booking first
    */

    userAppointments
        .slice()
        .reverse()
        .forEach(booking => {

            createAppointmentCard(
                booking,
                container
            );

        });

}


/* =====================================================
   CREATE APPOINTMENT CARD
===================================================== */

function createAppointmentCard(
    booking,
    container
){

    /*
       If admin has not assigned a status,
       default to Pending.
    */

    const status =
        booking.status || "Pending";


    /*
       Convert status to CSS class.
    */

    const statusClass =
        status
            .toLowerCase()
            .replace(/\s+/g,"");


    const card =
        document.createElement("div");


    card.className =
        "appointment-card";


    card.innerHTML = `

        <div class="appointment-top">

            <div>

                <div class="hospital-name">
                    ${escapeHTML(
                        booking.hospital ||
                        "-"
                    )}
                </div>

                <div class="doctor-name">
                    ${escapeHTML(
                        booking.doctor ||
                        "-"
                    )}
                </div>

            </div>


            <span
                class="
                    status
                    ${statusClass}
                ">

                ${escapeHTML(status)}

            </span>

        </div>


        <div class="appointment-details">


            <div class="appointment-detail">

                <span>
                    Patient Name
                </span>

                <strong>
                    ${escapeHTML(
                        booking.patientName ||
                        "-"
                    )}
                </strong>

            </div>


            <div class="appointment-detail">

                <span>
                    Specialization
                </span>

                <strong>
                    ${escapeHTML(
                        booking.speciality ||
                        "-"
                    )}
                </strong>

            </div>


            <div class="appointment-detail">

                <span>
                    Appointment Date
                </span>

                <strong>
                    ${escapeHTML(
                        booking.date ||
                        "-"
                    )}
                </strong>

            </div>


            <div class="appointment-detail">

                <span>
                    Time Slot
                </span>

                <strong>
                    ${escapeHTML(
                        booking.slot ||
                        "-"
                    )}
                </strong>

            </div>


            <div class="appointment-detail">

                <span>
                    Patient Age
                </span>

                <strong>
                    ${
                        booking.age
                            ? escapeHTML(
                                booking.age
                              ) + " years"
                            : "-"
                    }
                </strong>

            </div>


        </div>

    `;


    container.appendChild(card);

}
function updateBookingStatus(bookingId, newStatus) {

    let bookings =
        JSON.parse(
            localStorage.getItem("bookNMeetBookings")
        ) || [];

    bookings = bookings.map(booking => {

        if (String(booking.id) === String(bookingId)) {
            booking.status = newStatus;
        }

        return booking;
    });

    localStorage.setItem(
        "bookNMeetBookings",
        JSON.stringify(bookings)
    );

    loadAppointments();
}

/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

    const div =
        document.createElement("div");

    div.textContent =
        value;

    return div.innerHTML;

}


/* =====================================================
   SHOW MESSAGE
===================================================== */

function showMessage(text){

    const message =
        document.getElementById(
            "profileMessage"
        );


    message.textContent =
        text;


    message.classList.add(
        "show"
    );


    setTimeout(() => {

        message.classList.remove(
            "show"
        );

    }, 2500);

}


/* =====================================================
   LOGOUT
===================================================== */

function logout(){

    localStorage.removeItem(
        "bookNMeetCurrentUser"
    );

    window.location.href =
        "first.html";

}


/* =====================================================
   CLOSE MODAL WHEN CLICKING OUTSIDE
===================================================== */

document
.getElementById("editProfileModal")
.addEventListener(
    "click",
    function(event){

        if(
            event.target ===
            this
        ){

            closeEditProfile();

        }

    }
);


/* =====================================================
   INITIAL APPOINTMENT LOAD
===================================================== */

loadAppointmentHistory();


/*
   Refresh appointment status periodically.

   This allows the page to reflect changes
   made to the booking data while the profile
   page is open.
*/

setInterval(
    loadAppointmentHistory,
    2000
);

</script>
