<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Choose a new password for your Book N Meet account.">
<!-- Personal page: ask search engines not to list it -->
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="images/favicon.svg">
<meta name="theme-color" content="#12345b">
<title>Set a New Password | Book N Meet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/reset-password.css">
</head>
<body>

<!--
  This page opens from the link in the "reset your password" email.
  The link carries a one-time code, which this page sends to the
  backend server together with the new password.
-->

<main class="card">

  <a class="brand" href="landing.html">
    <div class="brand-mark">+</div>
    <div>Book <span>N</span> Meet</div>
  </a>

  <h1>Set a new password</h1>
  <p class="lead" id="lead">Choose a new password for your account.</p>

  <form id="resetForm" novalidate>

    <div class="field">
      <label for="newPassword">New password</label>
      <div class="password-wrap">
        <input type="password" id="newPassword" name="new-password" placeholder="Create a new password" maxlength="64" autocomplete="new-password" />
        <button type="button" class="eye-btn" id="eyeBtn" aria-label="Show password" title="Show password">
          <svg class="eye-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.9 10.9 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.1"/><path d="M6.5 6.6C3.7 8.5 2 12 2 12s3.6 7 10 7a10.7 10.7 0 0 0 5-1.2"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
        </button>
      </div>
      <ul class="pw-rules">
        <li id="ruleLength"><span class="mark">✕</span> At least 8 characters</li>
        <li id="ruleCap"><span class="mark">✕</span> Contains a capital letter</li>
        <li id="ruleDigit"><span class="mark">✕</span> Contains a digit</li>
        <li id="ruleSpecial"><span class="mark">✕</span> Contains a special character</li>
      </ul>
    </div>

    <p class="form-msg" id="resetMsg"></p>
    <button type="submit" class="btn-primary" id="resetBtn" disabled>Save new password</button>

  </form>

  <a class="back-link" href="landing.html">Back to login</a>

</main>

<script src="js/config.js"></script>
<script>

const API_URL = String((window.BNM_CONFIG && BNM_CONFIG.API_URL) || '').replace(/\/+$/, '');

const form = document.getElementById('resetForm');
const input = document.getElementById('newPassword');
const button = document.getElementById('resetBtn');
const message = document.getElementById('resetMsg');
const eyeBtn = document.getElementById('eyeBtn');

/* The email link adds the one-time code after the # in the address. */
const linkDetails = new URLSearchParams(window.location.hash.replace(/^#/, ''));
const accessToken = linkDetails.get('access_token') || '';
const linkError = linkDetails.get('error_description') || '';

function setMsg(text, type){
    message.textContent = text || '';
    message.className = 'form-msg' + (type ? ' ' + type : '');
}

if(!accessToken){
    form.hidden = true;
    document.getElementById('lead').textContent =
        linkError
            ? 'This reset link did not work: ' + linkError.replace(/\+/g, ' ') + '. Please ask for a new one from the login page.'
            : 'This page only works when you open it from the reset link in your email. Please use "Forgot your password?" on the login page.';
}

const rules = [
    { element: document.getElementById('ruleLength'),  test: v => v.length >= 8 },
    { element: document.getElementById('ruleCap'),     test: v => /[A-Z]/.test(v) },
    { element: document.getElementById('ruleDigit'),   test: v => /[0-9]/.test(v) },
    { element: document.getElementById('ruleSpecial'), test: v => /[^A-Za-z0-9]/.test(v) }
];

function checkPassword(){
    let allPass = true;
    rules.forEach(rule => {
        const pass = rule.test(input.value);
        rule.element.classList.toggle('valid', pass);
        rule.element.querySelector('.mark').textContent = pass ? '✓' : '✕';
        if(!pass) allPass = false;
    });
    button.disabled = !allPass;
    return allPass;
}

['input', 'change'].forEach(eventName => input.addEventListener(eventName, checkPassword));

eyeBtn.addEventListener('click', () => {
    const show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    eyeBtn.classList.toggle('showing', show);
    eyeBtn.title = show ? 'Hide password' : 'Show password';
    eyeBtn.setAttribute('aria-label', eyeBtn.title);
});

form.addEventListener('submit', async (event) => {
    event.preventDefault();
    if(!checkPassword()) return;

    button.disabled = true;
    button.textContent = 'Saving...';
    setMsg('');

    let data = null;

    try{
        const response = await fetch(API_URL + '/api/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ access_token: accessToken, password: input.value })
        });
        data = await response.json();
    }catch(error){
        data = null;
    }

    button.textContent = 'Save new password';

    if(!data || typeof data.success !== 'boolean'){
        button.disabled = false;
        setMsg('The server is not running. Please start it and try again.', 'error');
        return;
    }

    if(!data.success){
        button.disabled = false;
        setMsg(data.message || 'Your password could not be changed.', 'error');
        return;
    }

    form.querySelector('.field').hidden = true;
    button.hidden = true;
    setMsg('Your password has been changed. You can log in with it now.', 'success');
});

</script>
</body>
</html>
