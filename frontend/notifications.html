<script>

/*
  NOTIFICATIONS PAGE

  The notifications themselves are worked out in
  js/patient-notifications.js (shared with the bell icon
  on the other patient pages). This page only shows them.
*/

const container =
    document.getElementById("notificationContainer");

let lastShown = "";

function emptyState(icon, title, text){
    return `
        <div class="empty-state">
            <div class="empty-icon">${icon}</div>
            <h3>${title}</h3>
            <p>${text}</p>
        </div>
    `;
}

function loadNotifications(){

    const user = BNMPatientNotifications.getCurrentUser();
    const notifications = BNMPatientNotifications.list();

    /* Only redraw when something actually changed. */
    const signature = JSON.stringify([user && user.email, notifications]);

    if(signature === lastShown){
        return;
    }

    lastShown = signature;

    if(!user){
        container.innerHTML = emptyState(
            "👤",
            "Please log in",
            "Log in to view your appointment notifications."
        );
        return;
    }

    if(notifications.length === 0){
        container.innerHTML = emptyState(
            "🔔",
            "No notifications yet",
            "Your appointment updates will appear here."
        );
        return;
    }

    container.innerHTML = notifications.map(function(notification){
        return `
            <div class="notification-card ${notification.type} ${notification.read ? "" : "unread"}">

                <div class="notification-icon">
                    ${notification.icon}
                </div>

                <div class="notification-content">

                    <div class="notification-title">
                        ${notification.title}
                    </div>

                    <div class="notification-description">
                        ${notification.html}
                    </div>

                    <div class="notification-time">
                        ${notification.when}
                    </div>

                    ${notification.read
                        ? ""
                        : `<button class="mark-read" data-id="${notification.id}">Mark read</button>`}

                </div>

            </div>
        `;
    }).join("");
}

/* "Mark read" buttons */
container.addEventListener("click", function(event){

    const button = event.target.closest(".mark-read");

    if(!button){
        return;
    }

    BNMPatientNotifications.markRead(button.dataset.id);
    loadNotifications();
});

loadNotifications();

/*
  Refresh automatically, so when the hospital changes an
  appointment the page updates without reloading.
*/
window.addEventListener("storage", loadNotifications);
setInterval(loadNotifications, 2000);

</script>
