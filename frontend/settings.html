<script>
(function(){
const U="bookNMeetCurrentUser",S="bookNMeetHospitalSettings";
function read(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}}
function norm(v){return String(v||"").trim().toLowerCase().replace(/\s+/g," ")}
let user=read(U,{})||{};
let hospital=user.hospital||user.hospitalName||user.hospitalId||"";
let staff=user.name||user.fullName||user.staffName||"";
let email=user.email||user.staffEmail||"";
let phone=user.contact||user.contactNumber||user.phone||"";
let all=read(S,{})||{},saved=(all.hospitalSettings&&all.hospitalSettings[norm(hospital)])||{};
document.getElementById("hospitalName").value=saved.hospitalName||hospital;
document.getElementById("staffName").value=saved.staffName||staff;
document.getElementById("email").value=saved.email||email;
document.getElementById("contact").value=saved.contactNumber||phone;
document.getElementById("address").value=saved.hospitalAddress||"";
document.getElementById("duration").value=["15","30","45","60"].includes(String(saved.appointmentDuration))?saved.appointmentDuration:"30";
// document.getElementById("start").value=saved.workingStart||"09:00";
// document.getElementById("end").value=saved.workingEnd||"17:00";
function setTimeFields(time, prefix){
    time = time || (prefix === "start" ? "09:00" : "17:00");

    let [hour, minute] = time.split(":");
    hour = Number(hour);

    let period = hour >= 12 ? "PM" : "AM";

    if(hour === 0) hour = 12;
    else if(hour > 12) hour -= 12;

    document.getElementById(prefix + "Hour").value =
        String(hour).padStart(2,"0");

    document.getElementById(prefix + "Minute").value = minute;
    document.getElementById(prefix + "Period").value = period;
}

setTimeFields(saved.workingStart, "start");
setTimeFields(saved.workingEnd, "end");
function header(){let n=user.name||user.fullName||staff||"Hospital Staff",h=user.hospital||user.hospitalName||hospital||"Hospital";document.getElementById("headerStaff").textContent=n;document.getElementById("headerHospital").textContent=h;document.getElementById("profileBtn").textContent=n.split(/\s+/).slice(0,2).map(x=>x[0].toUpperCase()).join("")||"HS"}
header();
document.getElementById("profileBtn").onclick=()=>location.href="settings.html";
document.getElementById("logout").onclick=()=>{localStorage.removeItem(U);location.href="landing.html"};
document.getElementById("form").onsubmit=function(e){
// e.preventDefault();let st=document.getElementById("start").value,en=document.getElementById("end").value;
e.preventDefault();

function get24HourTime(prefix){
    let hour = Number(document.getElementById(prefix + "Hour").value);
    let minute = document.getElementById(prefix + "Minute").value;
    let period = document.getElementById(prefix + "Period").value;

    if(period === "AM"){
        if(hour === 12) hour = 0;
    }else{
        if(hour !== 12) hour += 12;
    }

    return String(hour).padStart(2,"0") + ":" + minute;
}

let st = get24HourTime("start");
let en = get24HourTime("end");
if(st>=en){alert("Working hours end time must be later than start time.");return}
let h=document.getElementById("hospitalName").value.trim(),n=document.getElementById("staffName").value.trim();
let data={hospitalName:h,staffName:n,email:document.getElementById("email").value.trim(),contactNumber:document.getElementById("contact").value.trim(),hospitalAddress:document.getElementById("address").value.trim(),appointmentDuration:Number(document.getElementById("duration").value),workingStart:st,workingEnd:en,updatedAt:new Date().toISOString()};
all.hospitalSettings=all.hospitalSettings||{};all.hospitalSettings[norm(h)]=data;localStorage.setItem(S,JSON.stringify(all));
user.name=n;user.fullName=n;user.staffName=n;user.hospital=h;user.hospitalName=h;user.email=data.email;user.contact=data.contactNumber;user.contactNumber=data.contactNumber;user.hospitalAddress=data.hospitalAddress;user.appointmentDuration=data.appointmentDuration;user.workingStart=st;user.workingEnd=en;localStorage.setItem(U,JSON.stringify(user));header();
document.getElementById("ok").classList.add("show");setTimeout(()=>document.getElementById("ok").classList.remove("show"),2500);
};
})();
